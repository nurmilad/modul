<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul NBS - Guru</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ===== CSS SAMA PERSIS DENGAN SEBELUMNYA ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #1a5f7a;
            --primary-light: #2a7f9a;
            --primary-dark: #0d3f5a;
            --secondary: #f39c12;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
            --header-height: 64px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 240px;
            background: var(--primary-dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 1000;
            transition: transform var(--transition);
            overflow-y: auto;
        }
        .sidebar-brand {
            padding: 20px 24px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-brand i {
            font-size: 26px;
            color: var(--secondary);
        }
        .sidebar-brand span {
            color: #fff;
        }
        .sidebar-brand small {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.7;
            display: block;
            margin-top: 2px;
        }
        .sidebar-menu {
            padding: 16px 12px;
            flex: 1;
        }
        .sidebar-menu .menu-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            padding: 8px 12px 4px;
            font-weight: 600;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: var(--transition);
            cursor: pointer;
            margin-bottom: 2px;
        }
        .sidebar-menu a:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .sidebar-menu a.active {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }
        .sidebar-menu a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            opacity: 0.6;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-footer i {
            font-size: 14px;
        }

        .main {
            margin-left: 240px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            height: var(--header-height);
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 500;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.92);
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar-left .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text);
            cursor: pointer;
        }
        .topbar-left h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar-right .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
        }
        .topbar-right .user-badge i {
            font-size: 18px;
            color: var(--primary);
        }
        .topbar-right .logout-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
        }
        .topbar-right .logout-btn:hover {
            background: #fee2e2;
            border-color: #f87171;
            color: #dc2626;
        }

        .page-content {
            padding: 28px 32px 40px;
            flex: 1;
        }

        /* LOGIN OVERLAY */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #fff;
            padding: 40px 48px;
            border-radius: var(--radius);
            box-shadow: 0 24px 64px rgba(0,0,0,0.2);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .login-box h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-box p {
            color: var(--text-light);
            margin-bottom: 24px;
        }
        .login-box select,
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
            background: #fff;
            color: var(--text);
        }
        .login-box select:focus,
        .login-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,95,122,0.1);
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-box button:hover {
            background: var(--primary-light);
        }
        .login-box .error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        /* DASHBOARD GURU */
        .guru-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .guru-header h1 {
            font-size: 26px;
            font-weight: 700;
        }
        .guru-header h1 small {
            font-weight: 400;
            font-size: 16px;
            color: var(--text-light);
            display: block;
            margin-top: 4px;
        }

        .guru-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .guru-controls input,
        .guru-controls select {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fff;
            color: var(--text);
            outline: none;
            transition: var(--transition);
            min-width: 140px;
        }
        .guru-controls input:focus,
        .guru-controls select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,95,122,0.12);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-primary:hover {
            background: var(--primary-light);
        }

        .btn-plus {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-plus:hover {
            background: var(--primary-light);
            transform: scale(1.02);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .module-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: var(--transition);
        }
        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
        .module-card .card-cover {
            padding: 18px 20px 14px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: #fff;
            position: relative;
        }
        .module-card .card-cover .card-title {
            font-size: 18px;
            font-weight: 600;
        }
        .module-card .card-cover .card-sub {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 2px;
        }
        .module-card .card-cover .card-badge {
            position: absolute;
            top: 14px;
            right: 16px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .module-card .card-body {
            padding: 16px 20px 20px;
        }
        .module-card .card-body .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 12px;
        }
        .module-card .card-body .card-meta i {
            width: 16px;
            margin-right: 4px;
        }
        .module-card .card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .module-card .card-actions button {
            padding: 5px 14px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text);
        }
        .module-card .card-actions button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .module-card .card-actions .btn-atp {
            border-color: #8b5cf6;
            color: #8b5cf6;
        }
        .module-card .card-actions .btn-atp:hover {
            background: #8b5cf6;
            color: #fff;
        }
        .module-card .card-actions .btn-prota {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .module-card .card-actions .btn-prota:hover {
            background: #3b82f6;
            color: #fff;
        }
        .module-card .card-actions .btn-prosem {
            border-color: #10b981;
            color: #10b981;
        }
        .module-card .card-actions .btn-prosem:hover {
            background: #10b981;
            color: #fff;
        }
        .module-card .card-actions .btn-rpm {
            border-color: #f59e0b;
            color: #f59e0b;
        }
        .module-card .card-actions .btn-rpm:hover {
            background: #f59e0b;
            color: #fff;
        }
        .module-card .card-actions .btn-delete {
            border-color: #ef4444;
            color: #ef4444;
            margin-left: auto;
        }
        .module-card .card-actions .btn-delete:hover {
            background: #ef4444;
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 56px;
            opacity: 0.3;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 20px;
            color: var(--text);
            margin-bottom: 6px;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: var(--radius);
            max-width: 640px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.2);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .modal-box .modal-sub {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-box .form-group {
            margin-bottom: 14px;
        }
        .modal-box .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
            display: block;
            margin-bottom: 4px;
        }
        .modal-box .form-group input,
        .modal-box .form-group select {
            width: 100%;
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fff;
            color: var(--text);
            outline: none;
            transition: var(--transition);
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,95,122,0.10);
        }
        .modal-box .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions button {
            padding: 10px 28px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-box .modal-actions .btn-cancel {
            background: var(--bg);
            color: var(--text);
        }
        .modal-box .modal-actions .btn-cancel:hover {
            background: var(--border);
        }
        .modal-box .modal-actions .btn-submit {
            background: var(--primary);
            color: #fff;
        }
        .modal-box .modal-actions .btn-submit:hover {
            background: var(--primary-light);
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s ease;
            max-width: 360px;
        }
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        .toast-info { background: var(--primary); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Error index message */
        .index-error {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-bottom: 20px;
            color: #856404;
        }
        .index-error a {
            color: #0d3f5a;
            font-weight: 600;
            text-decoration: underline;
        }
        .index-error a:hover {
            color: #1a5f7a;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .topbar-left .hamburger { display: block; }
            .page-content { padding: 16px; }
            .topbar { padding: 0 16px; }
            .modal-box .form-row { grid-template-columns: 1fr; }
            .login-box { padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-book-open"></i>
            <div>
                Modul NBS
                <small>Guru</small>
            </div>
        </div>
        <nav class="sidebar-menu">
            <div class="menu-label">Navigasi</div>
            <a href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="admin.html"><i class="fas fa-user-shield"></i> Admin</a>
            <a class="active" href="guru.html"><i class="fas fa-chalkboard-teacher"></i> Guru</a>
        </nav>
        <div class="sidebar-footer">
            <i class="fas fa-circle" style="color:#10b981;font-size:10px;"></i>
            <span id="sidebarUser">Belum login</span>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main">
        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h2 id="pageTitle">Dashboard Guru</h2>
            </div>
            <div class="topbar-right">
                <div class="user-badge">
                    <i class="fas fa-user-circle"></i>
                    <span id="topbarUser">Guest</span>
                </div>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Keluar</button>
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <div class="page-content" id="guruContent">
            <!-- Akan di-render oleh JS -->
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <h3>Memuat...</h3>
            </div>
        </div>
    </div>

    <!-- LOGIN OVERLAY -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>👩‍🏫 Login Guru</h2>
            <p>Pilih nama guru dan masukkan password.</p>
            <select id="loginGuruSelect">
                <option value="">-- Pilih Guru --</option>
            </select>
            <input type="password" id="loginGuruPass" placeholder="Password" />
            <button onclick="verifyGuru()">Masuk</button>
            <div class="error" id="loginError">Password salah atau guru tidak ditemukan.</div>
        </div>
    </div>

    <!-- MODAL BUAT MODUL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2>Buat Modul Ajar Baru</h2>
            <p class="modal-sub">Lengkapi data di bawah ini untuk memulai.</p>
            <form id="modalForm" onsubmit="submitModule(event)">
                <div class="form-group">
                    <label>Jenjang</label>
                    <select id="mJenjang" required>
                        <option value="">Pilih Jenjang</option>
                        <option value="SMP">SMP</option>
                        <option value="SMAS">SMAS</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mata Pelajaran</label>
                        <select id="mMapel" required><option value="">-- Pilih --</option></select>
                    </div>
                    <div class="form-group">
                        <label>Kelas</label>
                        <select id="mKelas" required><option value="">-- Pilih --</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Fase</label>
                    <input type="text" id="mFase" placeholder="Contoh: D, E, F" />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tahun Penyusunan</label>
                        <input type="number" id="mTahun" value="2026" required />
                    </div>
                    <div class="form-group">
                        <label>JP / Minggu</label>
                        <input type="number" id="mJp" value="4" required />
                    </div>
                </div>
                <div class="form-group">
                    <label>Alokasi Waktu (menit)</label>
                    <input type="number" id="mAlokasi" value="45" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Kepala Sekolah</label>
                        <select id="mKepsek" required><option value="">-- Pilih --</option></select>
                    </div>
                    <div class="form-group">
                        <label>NIP Kepala Sekolah</label>
                        <input type="text" id="mNip" placeholder="NIP" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tempat Pembuatan</label>
                        <input type="text" id="mTempat" placeholder="Kota / Kabupaten" required />
                    </div>
                    <div class="form-group">
                        <label>Tanggal Pembuatan</label>
                        <input type="date" id="mTanggal" required />
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn-submit"><i class="fas fa-check"></i> Buat Modul</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- FIREBASE & SCRIPT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5ETgu3Ufat1a_iM_n81Lir7sLUwI4p5A",
            authDomain: "modul-fae5a.firebaseapp.com",
            projectId: "modul-fae5a",
            storageBucket: "modul-fae5a.firebasestorage.app",
            messagingSenderId: "837647902643",
            appId: "1:837647902643:web:adfa809d9f8adbeaeacdc6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ===== STATE =====
        let currentGuru = null;
        let allModules = [];
        let allGuru = [];
        let allKelas = [];
        let allMapel = [];
        let allKepsek = [];
        let indexError = null;

        // ===== TOAST =====
        function toast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast toast-' + type;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 3000);
        }

        // ===== SIDEBAR =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ===== LOGIN =====
        async function loadGuruList() {
            try {
                const snap = await db.collection('guru').orderBy('name').get();
                allGuru = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const select = document.getElementById('loginGuruSelect');
                select.innerHTML = '<option value="">-- Pilih Guru --</option>';
                allGuru.forEach(g => {
                    select.innerHTML += `<option value="${g.id}">${g.name}</option>`;
                });
            } catch (e) {
                toast('Gagal memuat daftar guru: ' + e.message, 'error');
            }
        }

        function verifyGuru() {
            const id = document.getElementById('loginGuruSelect').value;
            const pass = document.getElementById('loginGuruPass').value;
            if (!id) { toast('Pilih guru terlebih dahulu.', 'error'); return; }
            const guru = allGuru.find(g => g.id === id);
            if (!guru) { document.getElementById('loginError').style.display = 'block'; return; }
            if (guru.password !== pass) {
                document.getElementById('loginError').style.display = 'block';
                return;
            }
            document.getElementById('loginError').style.display = 'none';
            currentGuru = guru;
            localStorage.setItem('nbs_guru', JSON.stringify(currentGuru));
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('sidebarUser').textContent = guru.name;
            document.getElementById('topbarUser').textContent = guru.name;
            toast('Selamat datang, ' + guru.name + '!', 'success');
            loadAllData();
        }

        document.getElementById('loginGuruPass').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') verifyGuru();
        });

        // ===== LOGOUT =====
        function logout() {
            localStorage.removeItem('nbs_guru');
            currentGuru = null;
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('loginGuruPass').value = '';
            document.getElementById('loginError').style.display = 'none';
            toast('Telah keluar.', 'info');
        }

        // ===== LOAD DATA =====
        async function loadAllData() {
            if (!currentGuru) return;
            try {
                // Reset index error
                indexError = null;
                await Promise.all([
                    loadModules(),
                    loadKelas(),
                    loadMapel(),
                    loadKepsek()
                ]);
                renderDashboard();
                populateDropdowns();
            } catch (e) {
                // Cek apakah error karena index
                if (e.message && e.message.includes('index')) {
                    indexError = e.message;
                    // Tampilkan pesan error yang jelas di dashboard
                    renderIndexError(e.message);
                } else {
                    toast('Gagal memuat data: ' + e.message, 'error');
                    console.error(e);
                    // Tampilkan dashboard kosong dengan pesan error
                    renderDashboardError(e.message);
                }
            }
        }

        async function loadModules() {
            try {
                // Coba query dengan orderBy
                const snap = await db.collection('modules')
                    .where('guru', '==', currentGuru.name)
                    .orderBy('createdAt', 'desc')
                    .get();
                allModules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (e) {
                // Jika error index, coba tanpa orderBy (fallback)
                if (e.message && e.message.includes('index')) {
                    console.warn('Index belum dibuat, mencoba tanpa orderBy...');
                    const snap = await db.collection('modules')
                        .where('guru', '==', currentGuru.name)
                        .get();
                    allModules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    // Urutkan di client
                    allModules.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    // Simpan pesan error untuk ditampilkan
                    indexError = e.message;
                } else {
                    throw e;
                }
            }
        }

        async function loadKelas() {
            const snap = await db.collection('kelas').orderBy('name').get();
            allKelas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        async function loadMapel() {
            const snap = await db.collection('mapel').orderBy('name').get();
            allMapel = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        async function loadKepsek() {
            const snap = await db.collection('kepsek').orderBy('name').get();
            allKepsek = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        // ===== RENDER ERROR INDEX =====
        function renderIndexError(errorMsg) {
            const container = document.getElementById('guruContent');
            // Extract link dari pesan error
            const linkMatch = errorMsg.match(/https:\/\/console\.firebase\.google\.com\/[^\s]+/);
            const link = linkMatch ? linkMatch[0] : '#';

            container.innerHTML = `
                <div class="index-error">
                    <h3><i class="fas fa-exclamation-triangle"></i> Perlu Membuat Index</h3>
                    <p>Firestore memerlukan index untuk query ini. Klik link di bawah untuk membuat index, lalu refresh halaman.</p>
                    <p><a href="${link}" target="_blank">${link}</a></p>
                    <p style="margin-top:10px;"><small>Atau hapus sementara orderBy di kode untuk sementara waktu.</small></p>
                    <button onclick="loadAllData()" class="btn-primary" style="margin-top:10px;">Coba Lagi</button>
                </div>
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <h3>Belum ada modul</h3>
                    <p>Klik tombol "Buat Modul Baru" untuk memulai.</p>
                    <button class="btn-plus" onclick="openModal()" style="margin-top:16px;"><i class="fas fa-plus-circle"></i> Buat Modul Baru</button>
                </div>
            `;
        }

        function renderDashboardError(msg) {
            const container = document.getElementById('guruContent');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                    <h3>Gagal Memuat Data</h3>
                    <p>${msg}</p>
                    <button class="btn-primary" onclick="loadAllData()" style="margin-top:12px;">Coba Lagi</button>
                </div>
            `;
        }

        // ===== POPULATE DROPDOWNS =====
        function populateDropdowns() {
            // Mapel
            const selMapel = document.getElementById('mMapel');
            if (selMapel) {
                selMapel.innerHTML = '<option value="">-- Pilih --</option>';
                allMapel.forEach(m => {
                    selMapel.innerHTML += `<option value="${m.name}">${m.name}</option>`;
                });
            }

            // Kelas
            const selKelas = document.getElementById('mKelas');
            if (selKelas) {
                selKelas.innerHTML = '<option value="">-- Pilih --</option>';
                allKelas.forEach(k => {
                    selKelas.innerHTML += `<option value="${k.name}">${k.name} (${k.jenjang})</option>`;
                });
            }

            // Kepsek
            const selKepsek = document.getElementById('mKepsek');
            if (selKepsek) {
                selKepsek.innerHTML = '<option value="">-- Pilih --</option>';
                allKepsek.forEach(k => {
                    selKepsek.innerHTML += `<option value="${k.name}" data-nip="${k.nip || ''}">${k.name}</option>`;
                });
                // Update NIP
                selKepsek.onchange = function() {
                    const opt = this.options[this.selectedIndex];
                    const nip = opt ? opt.dataset.nip || '' : '';
                    document.getElementById('mNip').value = nip;
                };
            }

            // Filter dropdowns for guru dashboard
            const filterMapel = document.getElementById('guruFilterMapel');
            if (filterMapel) {
                const val = filterMapel.value;
                filterMapel.innerHTML = '<option value="">Semua Mapel</option>';
                allMapel.forEach(m => {
                    filterMapel.innerHTML += `<option value="${m.name}">${m.name}</option>`;
                });
                filterMapel.value = val;
            }
        }

        // ===== RENDER DASHBOARD =====
        function renderDashboard() {
            const container = document.getElementById('guruContent');
            const search = document.getElementById('guruSearch') ? document.getElementById('guruSearch').value.toLowerCase() : '';
            const filterJenjang = document.getElementById('guruFilterJenjang') ? document.getElementById('guruFilterJenjang').value : '';
            const filterMapel = document.getElementById('guruFilterMapel') ? document.getElementById('guruFilterMapel').value : '';

            let filtered = allModules.filter(m => {
                const matchSearch = (m.mapel || '').toLowerCase().includes(search) ||
                    (m.kelas || '').toLowerCase().includes(search);
                const matchJenjang = filterJenjang ? m.jenjang === filterJenjang : true;
                const matchMapel = filterMapel ? m.mapel === filterMapel : true;
                return matchSearch && matchJenjang && matchMapel;
            });

            // Build HTML
            let html = '';

            // Tampilkan peringatan index jika ada
            if (indexError) {
                html += `
                    <div class="index-error">
                        <i class="fas fa-info-circle"></i> 
                        <strong>Perhatian:</strong> Index belum dibuat. Data mungkin tidak terurut. 
                        <a href="${indexError.match(/https:\/\/console\.firebase\.google\.com\/[^\s]+/)?.[0] || '#'}" target="_blank">Buat index di sini</a>.
                        <button onclick="loadAllData()" style="background:none;border:none;color:var(--primary);cursor:pointer;text-decoration:underline;">Coba lagi</button>
                    </div>
                `;
            }

            html += `
                <div class="guru-header">
                    <div>
                        <h1>Dashboard Guru <small>${currentGuru ? currentGuru.name : ''}</small></h1>
                    </div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <button class="btn-plus" onclick="openModal()"><i class="fas fa-plus-circle"></i> Buat Modul Baru</button>
                    </div>
                </div>
                <div class="guru-controls" style="margin-bottom:20px;">
                    <input type="text" id="guruSearch" placeholder="Cari mapel / kelas..." oninput="filterGuru()" />
                    <select id="guruFilterJenjang" onchange="filterGuru()">
                        <option value="">Semua Jenjang</option>
                        <option value="SMP">SMP</option>
                        <option value="SMAS">SMAS</option>
                    </select>
                    <select id="guruFilterMapel" onchange="filterGuru()">
                        <option value="">Semua Mapel</option>
                    </select>
                    <button class="btn-primary" onclick="refreshGuru()"><i class="fas fa-sync"></i> Refresh</button>
                </div>
                <div class="cards-grid" id="guruCards">
            `;

            if (filtered.length === 0) {
                html += `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>Belum ada modul</h3>
                        <p>Klik tombol "Buat Modul Baru" untuk memulai.</p>
                    </div>
                `;
            } else {
                filtered.forEach(m => {
                    html += `
                        <div class="module-card" data-id="${m.id}">
                            <div class="card-cover">
                                <div class="card-title">${m.mapel || 'Tanpa Mapel'}</div>
                                <div class="card-sub">${m.kelas || 'Tanpa Kelas'} • ${m.jenjang || '-'}</div>
                                <div class="card-badge">${m.fase || '-'}</div>
                            </div>
                            <div class="card-body">
                                <div class="card-meta">
                                    <span><i class="fas fa-user"></i> ${m.guru || 'Unknown'}</span>
                                    <span><i class="fas fa-calendar"></i> ${m.tahunPenyusunan || '-'}</span>
                                    <span><i class="fas fa-clock"></i> ${m.jpPerMinggu || '?'} JP/mg</span>
                                </div>
                                <div class="card-actions">
                                    <button class="btn-atp" onclick="alert('Buka ATP untuk modul ${m.id}')">ATP</button>
                                    <button class="btn-prota" onclick="alert('Buka Prota untuk modul ${m.id}')">Prota</button>
                                    <button class="btn-prosem" onclick="alert('Buka Prosem untuk modul ${m.id}')">Prosem</button>
                                    <button class="btn-rpm" onclick="alert('Buka RPM untuk modul ${m.id}')">RPM</button>
                                    <button class="btn-delete" onclick="deleteModule('${m.id}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            container.innerHTML = html;

            // Re-populate filter dropdowns
            populateDropdowns();
        }

        function filterGuru() {
            renderDashboard();
        }

        function refreshGuru() {
            loadAllData();
            toast('Dashboard diperbarui', 'info');
        }

        // ===== DELETE MODULE =====
        async function deleteModule(id) {
            if (!confirm('Hapus modul ini? Semua data akan hilang.')) return;
            try {
                await db.collection('modules').doc(id).delete();
                toast('Modul dihapus.', 'info');
                await loadModules();
                renderDashboard();
            } catch (e) {
                toast('Gagal hapus: ' + e.message, 'error');
            }
        }

        // ===== MODAL =====
        function openModal() {
            if (!currentGuru) { toast('Silakan login terlebih dahulu.', 'error'); return; }
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('mTanggal').value = new Date().toISOString().split('T')[0];
            populateDropdowns();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        async function submitModule(e) {
            e.preventDefault();
            const data = {
                jenjang: document.getElementById('mJenjang').value,
                mapel: document.getElementById('mMapel').value,
                kelas: document.getElementById('mKelas').value,
                fase: document.getElementById('mFase').value || '-',
                tahunPenyusunan: parseInt(document.getElementById('mTahun').value),
                jpPerMinggu: parseInt(document.getElementById('mJp').value),
                alokasiWaktu: parseInt(document.getElementById('mAlokasi').value),
                kepalaSekolah: document.getElementById('mKepsek').value,
                nipKepalaSekolah: document.getElementById('mNip').value,
                tempatPembuatan: document.getElementById('mTempat').value,
                tanggalPembuatan: document.getElementById('mTanggal').value,
                guru: currentGuru.name,
                data: [],
                atp: '',
                prota: '',
                prosem: '',
                rpm: '',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            if (!data.jenjang || !data.mapel || !data.kelas || !data.kepalaSekolah) {
                toast('Lengkapi semua field yang wajib!', 'error');
                return;
            }
            try {
                const ref = await db.collection('modules').add(data);
                toast('Modul berhasil dibuat!', 'success');
                closeModal();
                await loadModules();
                renderDashboard();
            } catch (e) {
                toast('Gagal membuat modul: ' + e.message, 'error');
            }
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            const saved = localStorage.getItem('nbs_guru');
            if (saved) {
                try {
                    const guru = JSON.parse(saved);
                    currentGuru = guru;
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('sidebarUser').textContent = guru.name;
                    document.getElementById('topbarUser').textContent = guru.name;
                    loadGuruList().then(() => {
                        const select = document.getElementById('loginGuruSelect');
                        for (let opt of select.options) {
                            if (opt.value === guru.id) opt.selected = true;
                        }
                        loadAllData();
                    });
                    return;
                } catch (e) {}
            }
            document.getElementById('loginOverlay').style.display = 'flex';
            loadGuruList();
        });

        // Expose global
        window.toggleSidebar = toggleSidebar;
        window.logout = logout;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.submitModule = submitModule;
        window.filterGuru = filterGuru;
        window.refreshGuru = refreshGuru;
        window.deleteModule = deleteModule;
        window.verifyGuru = verifyGuru;
        window.toast = toast;
        window.loadAllData = loadAllData;
        window.renderDashboard = renderDashboard;
    </script>

</body>
</html>
