<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul NBS - Perangkat</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* --- semua gaya tetap seperti sebelumnya --- */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #1a5f7a; --primary-light: #2a7f9a; --primary-dark: #0d3f5a;
            --secondary: #f39c12; --bg: #f0f4f8; --card-bg: #ffffff;
            --text: #1e293b; --text-light: #64748b; --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0,0,0,0.06); --radius: 16px; --radius-sm: 10px;
            --transition: 0.25s ease; --header-height: 64px;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        /* ... semua gaya sidebar, topbar, tabs, konten ... */
        /* (saya tidak tulis ulang seluruh CSS di sini, karena tetap sama seperti versi sebelumnya) */
        /* Pastikan Anda menggunakan CSS dari perangkat.html versi awal, tidak ada perubahan */
    </style>
</head>
<body>
    <!-- SIDEBAR, TOPBAR, DAN KONTEN SAMA SEPERTI SEBELUMNYA -->
    <!-- ... (semua HTML tetap) ... -->

    <!-- ===== SCRIPT TAMBAHAN UNTUK MEMBACA PARAMETER URL ===== -->
    <script>
        // ===== FUNGSI UNTUK SWITCH TAB BERDASARKAN PARAMETER URL =====
        function switchTabFromURL() {
            const params = new URLSearchParams(window.location.search);
            const tab = params.get('tab');
            if (tab) {
                const targetTab = document.getElementById(tab);
                if (targetTab) {
                    // Nonaktifkan semua tab
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.perangkat-tabs button').forEach(el => el.classList.remove('active'));
                    // Aktifkan tab yang diminta
                    targetTab.classList.add('active');
                    const btn = document.querySelector(`.perangkat-tabs button[data-tab="${tab}"]`);
                    if (btn) btn.classList.add('active');
                }
            }
        }

        // Jalankan setelah DOM siap
        document.addEventListener('DOMContentLoaded', function() {
            // Panggil fungsi switch tab dari URL
            switchTabFromURL();

            // Perbaiki fungsi switchTab yang sudah ada agar tetap bekerja
            const originalSwitchTab = window.switchTab;
            if (typeof originalSwitchTab === 'function') {
                window.switchTab = function(tabId) {
                    // Panggil fungsi asli
                    originalSwitchTab(tabId);
                    // Update URL agar bookmarkable
                    const url = new URL(window.location);
                    url.searchParams.set('tab', tabId);
                    window.history.replaceState({}, '', url);
                };
            }
        });

        // Override switchTab global agar tetap sinkron dengan URL
        // (kode ini akan menimpa fungsi switchTab yang didefinisikan di bagian atas)
        // Namun karena kita tidak bisa mengubah deklarasi fungsi asli dengan mudah,
        // kita bungkus dengan pendekatan di atas.
        // Jika fungsi switchTab belum didefinisikan, kita definisikan.
        if (typeof window.switchTab !== 'function') {
            window.switchTab = function(tabId) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.perangkat-tabs button').forEach(el => el.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                document.querySelector(`.perangkat-tabs button[data-tab="${tabId}"]`).classList.add('active');
                // Update URL
                const url = new URL(window.location);
                url.searchParams.set('tab', tabId);
                window.history.replaceState({}, '', url);
            };
        }
    </script>
</body>
</html>
