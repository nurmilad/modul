<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul NBS - Dashboard</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* semua CSS sama seperti sebelumnya (tidak ada perubahan) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #1a5f7a;
            --primary-light: #2a7f9a;
            --primary-dark: #0d3f5a;
            --secondary: #f39c12;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
            --header-height: 64px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 240px;
            background: var(--primary-dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 1000;
            transition: transform var(--transition);
            overflow-y: auto;
        }
        .sidebar-brand {
            padding: 20px 24px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-brand i {
            font-size: 26px;
            color: var(--secondary);
        }
        .sidebar-brand span {
            color: #fff;
        }
        .sidebar-brand small {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.7;
            display: block;
            margin-top: 2px;
        }
        .sidebar-menu {
            padding: 16px 12px;
            flex: 1;
        }
        .sidebar-menu .menu-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            padding: 8px 12px 4px;
            font-weight: 600;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: var(--transition);
            cursor: pointer;
            margin-bottom: 2px;
        }
        .sidebar-menu a:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .sidebar-menu a.active {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }
        .sidebar-menu a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            opacity: 0.6;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-footer i {
            font-size: 14px;
        }

        .main {
            margin-left: 240px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            height: var(--header-height);
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 500;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.92);
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar-left .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text);
            cursor: pointer;
        }
        .topbar-left h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar-right .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
        }
        .topbar-right .user-badge i {
            font-size: 18px;
            color: var(--primary);
        }
        .topbar-right .logout-btn {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
        }
        .topbar-right .logout-btn:hover {
            background: #fee2e2;
            border-color: #f87171;
            color: #dc2626;
        }

        .page-content {
            padding: 28px 32px 40px;
            flex: 1;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .dash-header h1 {
            font-size: 26px;
            font-weight: 700;
        }
        .dash-header h1 small {
            font-weight: 400;
            font-size: 16px;
            color: var(--text-light);
            display: block;
            margin-top: 4px;
        }

        .dash-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .dash-controls input,
        .dash-controls select {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fff;
            color: var(--text);
            outline: none;
            transition: var(--transition);
            min-width: 140px;
        }
        .dash-controls input:focus,
        .dash-controls select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 95, 122, 0.12);
        }
        .dash-controls .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }
        .dash-controls .btn-primary:hover {
            background: var(--primary-light);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .stat-card .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-card .stat-label {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .module-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: var(--transition);
        }
        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
        .module-card .card-cover {
            padding: 18px 20px 14px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: #fff;
            position: relative;
        }
        .module-card .card-cover .card-title {
            font-size: 18px;
            font-weight: 600;
        }
        .module-card .card-cover .card-sub {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 2px;
        }
        .module-card .card-cover .card-badge {
            position: absolute;
            top: 14px;
            right: 16px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .module-card .card-body {
            padding: 16px 20px 20px;
        }
        .module-card .card-body .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 12px;
        }
        .module-card .card-body .card-meta i {
            width: 16px;
            margin-right: 4px;
        }
        .module-card .card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .module-card .card-actions button {
            padding: 5px 14px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text);
        }
        .module-card .card-actions button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .module-card .card-actions .btn-atp {
            border-color: #8b5cf6;
            color: #8b5cf6;
        }
        .module-card .card-actions .btn-atp:hover {
            background: #8b5cf6;
            color: #fff;
        }
        .module-card .card-actions .btn-prota {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .module-card .card-actions .btn-prota:hover {
            background: #3b82f6;
            color: #fff;
        }
        .module-card .card-actions .btn-prosem {
            border-color: #10b981;
            color: #10b981;
        }
        .module-card .card-actions .btn-prosem:hover {
            background: #10b981;
            color: #fff;
        }
        .module-card .card-actions .btn-rpm {
            border-color: #f59e0b;
            color: #f59e0b;
        }
        .module-card .card-actions .btn-rpm:hover {
            background: #f59e0b;
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 56px;
            opacity: 0.3;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 20px;
            color: var(--text);
            margin-bottom: 6px;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s ease;
            max-width: 360px;
        }
        .toast-success {
            background: #10b981;
        }
        .toast-error {
            background: #ef4444;
        }
        .toast-info {
            background: var(--primary);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
            }
            .topbar-left .hamburger {
                display: block;
            }
            .page-content {
                padding: 16px;
            }
            .topbar {
                padding: 0 16px;
            }
            .dash-header h1 {
                font-size: 20px;
            }
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }
            .dash-controls {
                width: 100%;
            }
            .dash-controls input,
            .dash-controls select {
                flex: 1;
                min-width: 100px;
            }
        }
        @media (max-width: 480px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
            .topbar-right .user-badge span {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-book-open"></i>
            <div>
                Modul NBS
                <small>Dashboard</small>
            </div>
        </div>
        <nav class="sidebar-menu">
            <div class="menu-label">Navigasi</div>
            <a class="active" href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="admin.html"><i class="fas fa-user-shield"></i> Admin</a>
            <a href="guru.html"><i class="fas fa-chalkboard-teacher"></i> Guru</a>
        </nav>
        <div class="sidebar-footer">
            <i class="fas fa-circle" style="color:#10b981;font-size:10px;"></i>
            <span id="sidebarUser">Pengunjung</span>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main">
        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h2 id="pageTitle">Dashboard</h2>
            </div>
            <div class="topbar-right">
                <div class="user-badge">
                    <i class="fas fa-user-circle"></i>
                    <span id="topbarUser">Pengunjung</span>
                </div>
                <!-- Tidak ada tombol logout karena tidak login -->
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <div class="page-content">
            <div class="dash-header">
                <div>
                    <h1>Dashboard Modul NBS <small>Semua perangkat ajar yang telah dibuat</small></h1>
                </div>
                <div class="dash-controls">
                    <input type="text" id="dashSearch" placeholder="Cari mapel / kelas..." oninput="filterModules()" />
                    <select id="dashFilterJenjang" onchange="filterModules()">
                        <option value="">Semua Jenjang</option>
                        <option value="SMP">SMP</option>
                        <option value="SMAS">SMAS</option>
                    </select>
                    <select id="dashFilterMapel" onchange="filterModules()">
                        <option value="">Semua Mapel</option>
                    </select>
                    <button class="btn-primary" onclick="refreshModules()"><i class="fas fa-sync"></i> Refresh</button>
                </div>
            </div>

            <div class="stats-row" id="dashStats">
                <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div class="stat-label">Total Modul</div></div>
                <div class="stat-card"><div class="stat-number" id="statMapel">0</div><div class="stat-label">Mata Pelajaran</div></div>
                <div class="stat-card"><div class="stat-number" id="statGuru">0</div><div class="stat-label">Guru</div></div>
                <div class="stat-card"><div class="stat-number" id="statRPM">0</div><div class="stat-label">Dengan RPM</div></div>
            </div>

            <div class="cards-grid" id="dashCards">
                <!-- Cards akan di-render oleh JavaScript -->
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- FIREBASE & SCRIPT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5ETgu3Ufat1a_iM_n81Lir7sLUwI4p5A",
            authDomain: "modul-fae5a.firebaseapp.com",
            projectId: "modul-fae5a",
            storageBucket: "modul-fae5a.firebasestorage.app",
            messagingSenderId: "837647902643",
            appId: "1:837647902643:web:adfa809d9f8adbeaeacdc6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allModules = [];

        function toast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast toast-' + type;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 3000);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function loadModules() {
            try {
                const snap = await db.collection('modules').orderBy('createdAt', 'desc').get();
                allModules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                populateMapelFilter();
                renderDashboard();
            } catch (e) {
                toast('Gagal memuat modul: ' + e.message, 'error');
            }
        }

        function populateMapelFilter() {
            const sel = document.getElementById('dashFilterMapel');
            const mapelSet = new Set(allModules.map(m => m.mapel).filter(Boolean));
            const currentVal = sel.value;
            sel.innerHTML = '<option value="">Semua Mapel</option>';
            mapelSet.forEach(m => {
                sel.innerHTML += `<option value="${m}">${m}</option>`;
            });
            sel.value = currentVal;
        }

        function renderDashboard() {
            const search = document.getElementById('dashSearch').value.toLowerCase();
            const filterJenjang = document.getElementById('dashFilterJenjang').value;
            const filterMapel = document.getElementById('dashFilterMapel').value;

            let filtered = allModules.filter(m => {
                const matchSearch = (m.mapel || '').toLowerCase().includes(search) ||
                    (m.kelas || '').toLowerCase().includes(search);
                const matchJenjang = filterJenjang ? m.jenjang === filterJenjang : true;
                const matchMapel = filterMapel ? m.mapel === filterMapel : true;
                return matchSearch && matchJenjang && matchMapel;
            });

            // Stats
            document.getElementById('statTotal').textContent = allModules.length;
            const mapelSet = new Set(allModules.map(m => m.mapel).filter(Boolean));
            document.getElementById('statMapel').textContent = mapelSet.size;
            const guruSet = new Set(allModules.map(m => m.guru).filter(Boolean));
            document.getElementById('statGuru').textContent = guruSet.size;
            const rpmCount = allModules.filter(m => m.rpm && m.rpm.length > 20).length;
            document.getElementById('statRPM').textContent = rpmCount;

            const container = document.getElementById('dashCards');
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>Tidak ada modul</h3>
                        <p>Belum ada perangkat ajar yang dibuat. Guru dapat membuat modul baru.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(m => `
                <div class="module-card" data-id="${m.id}">
                    <div class="card-cover">
                        <div class="card-title">${m.mapel || 'Tanpa Mapel'}</div>
                        <div class="card-sub">${m.kelas || 'Tanpa Kelas'} • ${m.jenjang || '-'}</div>
                        <div class="card-badge">${m.fase || '-'}</div>
                    </div>
                    <div class="card-body">
                        <div class="card-meta">
                            <span><i class="fas fa-user"></i> ${m.guru || 'Unknown'}</span>
                            <span><i class="fas fa-calendar"></i> ${m.tahunPenyusunan || '-'}</span>
                            <span><i class="fas fa-clock"></i> ${m.jpPerMinggu || '?'} JP/mg</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-atp" onclick="alert('Buka ATP untuk modul ${m.id}')">ATP</button>
                            <button class="btn-prota" onclick="alert('Buka Prota untuk modul ${m.id}')">Prota</button>
                            <button class="btn-prosem" onclick="alert('Buka Prosem untuk modul ${m.id}')">Prosem</button>
                            <button class="btn-rpm" onclick="alert('Buka RPM untuk modul ${m.id}')">RPM</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterModules() {
            renderDashboard();
        }

        function refreshModules() {
            loadModules();
            toast('Dashboard diperbarui', 'info');
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadModules();
            // Sidebar close on outside click mobile
            document.addEventListener('click', function(e) {
                const sidebar = document.getElementById('sidebar');
                if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
                    if (!sidebar.contains(e.target) && !e.target.closest('.hamburger')) {
                        sidebar.classList.remove('open');
                    }
                }
            });
        });

        window.toggleSidebar = toggleSidebar;
        window.filterModules = filterModules;
        window.refreshModules = refreshModules;
        window.loadModules = loadModules;
        window.toast = toast;
    </script>
</body>
</html>
