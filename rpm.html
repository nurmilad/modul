    <script>
        // ... semua variabel dan fungsi awal sama ...

        // ================================================================
        // ===== CALL GROQ API (PROMPT DISEDERHANAKAN) =====
        // ================================================================
        async function callGroq(tp, deskripsi) {
            const cp = moduleData.atp || 'Belum ada Capaian Pembelajaran.';
            const profilLulusan = [
                'Keimanan & Ketakwaan',
                'Kewargaan',
                'Penalaran Kritis',
                'Kreativitas',
                'Kolaborasi',
                'Kemandirian',
                'Kesehatan',
                'Komunikasi'
            ];

            const jpPerMinggu = moduleData.jpPerMinggu || 2;
            const alokasiJP = parseInt(tp.alokasiJp) || 4;
            const jumlahPertemuan = Math.ceil(alokasiJP / jpPerMinggu);
            const waktuInti = jpPerMinggu * 45 - 30;

            const angka = ['PERTAMA', 'KEDUA', 'KETIGA', 'KEEMPAT', 'KELIMA', 'KEENAM', 'KETUJUH', 'KEDELAPAN'];
            const pertemuanList = [];
            for (let i = 1; i <= jumlahPertemuan; i++) {
                const label = i <= angka.length ? angka[i-1] : `KE-${i}`;
                pertemuanList.push(`PERTEMUAN ${label}`);
            }
            const pertemuanStr = pertemuanList.map(p => `  ${p}\n`).join('');

            // ==================== PROMPT SEDERHANA ====================
            const systemPrompt = `Anda adalah asisten AI yang membantu guru membuat Rencana Pembelajaran Mendalam (RPM). 
Gunakan bahasa Indonesia formal. Ikuti aturan berikut:

1. Judul bagian utama harus ditulis dengan **bold** (tanda ** di awal dan akhir), contoh: **I. IDENTITAS**
2. Buat tabel dengan pemisah kolom menggunakan tanda | (pipa).
3. Untuk daftar, gunakan tanda - atau angka.
4. Jangan gunakan simbol *, #, _, =, atau markdown lainnya di dalam tabel atau isi sel. Hanya judul bagian yang boleh bold.
5. Beri jarak satu baris kosong antar bagian.

Contoh format yang harus diikuti:

**I. IDENTITAS**
| Kolom 1 | Kolom 2 |
| Unit Kerja | SMA Nurmilad |
| Nama Guru | Budi Santoso |

**II. PROFIL LULUSAN**
| PROFIL | DESKRIPSI |
| Keimanan | ... |

**III. DESAIN PEMBELAJARAN**
A. Tujuan Pembelajaran: ...
B. Praktik Pedagogis:
| Praktik | Deskripsi |
| Berkesadaran | ... |

**IV. PENGALAMAN BELAJAR**
PERTEMUAN PERTAMA
Kegiatan Awal (15 menit):
- Salam dan doa
- Absensi
- Apersepsi (2 pertanyaan)
- Penjelasan tujuan

Kegiatan Inti (90 menit):
A. Memahami:
  - aktivitas 1
  - aktivitas 2
B. Mengaplikasikan:
  - aktivitas 3
C. Merefleksi:
  - aktivitas 4

Kegiatan Penutup (15 menit):
- Refleksi
- Tanya jawab
- Tugas

**V. ASESMEN**
Asesmen Awal: ...
Asesmen Proses: ...
Asesmen Sumatif: ...
Soal 1: (esai)
Soal 2: (esai)

**VI. BAHAN BACAAN & DAFTAR PUSTAKA**
1. ...
2. ...

Ikuti format ini dengan konsisten. Isi setiap bagian secara lengkap dan detail.`;

            const userPrompt = `
Buat RPM dengan data berikut:

**I. IDENTITAS**
- Unit Kerja    : ${moduleData.jenjang || 'SMA'} Nurmilad Boarding School
- Nama Guru     : ${moduleData.guru || '-'}
- Mata Pelajaran: ${moduleData.mapel || '-'}
- Kelas/Fase    : ${moduleData.kelas || '-'} / ${moduleData.fase || '-'}
- Materi Pokok  : ${tp.materi || '-'}
- Alokasi Waktu : ${alokasiJP} JP (${jumlahPertemuan} pertemuan, @ ${jpPerMinggu} JP/minggu)

**II. PROFIL LULUSAN**
Pilih 3 atau 4 profil yang relevan dari daftar:
${profilLulusan.map(p => `- ${p}`).join('\n')}
Buat tabel 2 kolom: PROFIL dan DESKRIPSI INTEGRASI.

**III. DESAIN PEMBELAJARAN**
A. Tujuan Pembelajaran: ${tp.tujuan || '-'}
B. Praktik Pedagogis (tabel 2 kolom tanpa header, kolom kiri = nama praktik, kolom kanan = deskripsi):
- Berkesadaran (Mindful) : [contoh]
- Bermakna (Meaningful) : [contoh]
- Menggembirakan (Joyful) : [contoh]
- Kemitraan Pembelajaran : [contoh]
- Lintas Mata Pelajaran : [contoh]
- Lingkungan Belajar : [contoh]
- Dimensi Keterampilan : [contoh]
- Pemanfaatan Digital : [contoh]

**IV. PENGALAMAN BELAJAR**
Rincian kegiatan untuk ${jumlahPertemuan} pertemuan:
${pertemuanStr}
Setiap pertemuan wajib memiliki:
- Kegiatan Awal (15 menit): salam, doa, absensi, apersepsi (2-3 pertanyaan), asesmen diagnostik (jika ada), penjelasan tujuan.
- Kegiatan Inti (${waktuInti} menit): A. Memahami, B. Mengaplikasikan, C. Merefleksi dengan deskripsi detail.
- Kegiatan Penutup (15 menit): refleksi, tanya jawab, penguatan, tugas, doa.

**V. ASESMEN**
- Asesmen Awal/Diagnostik: [deskripsi]
- Asesmen Proses/Formatif: [deskripsi dengan 3-5 indikator]
- Asesmen Sumatif: [deskripsi]
- Soal 1: [esai]
- Soal 2: [esai]
- Soal 3: [esai]
- Soal 4: [esai]
- Soal 5: [esai]

**VI. BAHAN BACAAN & DAFTAR PUSTAKA**
Minimal 3 referensi.

${deskripsi ? `\nARAHAN KHUSUS: ${deskripsi}` : ''}

Ikuti contoh format yang diberikan. Hanya judul bagian yang bold. Isi tabel tidak boleh bold. Gunakan bahasa Indonesia yang baik.`;

            // ==================== AKHIR PROMPT ====================

            const response = await fetch(GROQ_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + GROQ_API_KEY
                },
                body: JSON.stringify({
                    model: GROQ_MODEL,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: userPrompt }
                    ],
                    temperature: 0.5,
                    max_tokens: 4096
                })
            });

            if (!response.ok) {
                let errorMsg = `HTTP ${response.status}`;
                try {
                    const errorData = await response.json();
                    if (errorData.error && errorData.error.message) {
                        errorMsg = errorData.error.message;
                    }
                } catch (e) {}
                throw new Error(errorMsg);
            }

            const data = await response.json();
            if (data.choices && data.choices.length > 0 && data.choices[0].message) {
                return data.choices[0].message.content;
            } else {
                throw new Error('Respons dari Groq tidak valid.');
            }
        }

        // ===== PERBAIKAN cleanText (tidak menghapus **) =====
        function cleanText(text) {
            if (!text) return '';
            text = text.replace(/^[=\-]{5,}\s*$/gm, '');
            // text = text.replace(/\*\*/g, ''); // <- baris ini dihapus
            text = text.replace(/__/g, '');
            text = text.replace(/_(?! )/g, '');
            text = text.replace(/\n{3,}/g, '\n\n');
            return text.trim();
        }

        // ... semua fungsi lainnya (formatRPMContent, viewRPM, dll.) tetap sama ...
    </script>
